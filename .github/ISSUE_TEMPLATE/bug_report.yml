name: 缺陷报告 / Bug report
description: 提供可复现、已脱敏的问题信息。
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 面板版本 / Version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统、架构与安装方式
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤与预期/实际结果
      description: 不要上传真实订阅、密码、IP 清单、私钥或数据库。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏错误和验证结果
  - type: checkboxes
    id: privacy
    attributes:
      label: 信息检查
      options:
        - label: 我已移除凭证和私人数据，安全漏洞会通过私密渠道报告。
          required: true
