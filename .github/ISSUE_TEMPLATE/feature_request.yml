name: 功能建议 / Feature request
description: 说明跨境团队的具体使用场景。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望实现的行为
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 资源约束与替代方案
