name: Commit release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'codex/auto-release-*']

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: commit-release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Prepare, merge or publish the tested version
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TESTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_EVENT: ${{ github.event.workflow_run.event }}
        run: bash scripts/auto-release.sh
