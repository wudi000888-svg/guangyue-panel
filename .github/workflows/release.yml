name: Publish version
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested version tag
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Obtain artifacts from successful CI for this exact commit
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          commit=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow ci.yml --commit "$commit" --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run_id" || { echo 'Run full CI, including installation tests, successfully before publishing this tag.'; exit 1; }
          gh run download "$run_id" --name linux-amd64 --dir build/releases
          (cd build/releases && sha256sum -c SHA256SUMS)
      - name: Upload, verify downloads and publish
        run: bash scripts/publish-release.sh "$RELEASE_TAG"
