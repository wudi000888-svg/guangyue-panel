name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-fixture-only
          POSTGRES_DB: guangyue_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GY_TEST_POSTGRES_DSN: postgres://postgres:ci-fixture-only@127.0.0.1:5432/guangyue_test?sslmode=disable # gitleaks:allow ephemeral CI fixture
      GY_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/check.sh
      - name: Scan reachable Go vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Scan source and all Git history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          scan_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$scan_dir"
          gitleaks dir "$scan_dir" --redact --no-banner
          gitleaks git . --redact --no-banner --log-opts=--all
      - run: bash scripts/build.sh
      - run: bash scripts/build-hy2-core.sh --test && bash scripts/build-xray-core.sh --test
      - run: python3 scripts/third-party.py && python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-amd64
          path: |
            build/releases/*.tar.gz
            build/releases/SHA256SUMS
            build/releases/SBOM.spdx.json
            build/releases/install.sh
          retention-days: 7
  installation:
    name: installation (${{ matrix.os }}, ${{ matrix.edition }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            edition: lite
          - os: ubuntu-24.04
            edition: pro
          - os: ubuntu-24.04
            edition: business-lite
            asset: lite
          - os: ubuntu-24.04
            edition: business
            asset: pro
          - os: ubuntu-24.04
            edition: updater-lite
            asset: lite
          - os: ubuntu-24.04
            edition: updater-pro
            asset: pro
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download build artifact using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name linux-amd64 --dir build/releases
      - name: Prepare disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx libnginx-mod-stream certbot python3 curl unzip openssl
          sudo systemctl enable --now nginx
          cd build/releases
          sha256sum -c SHA256SUMS
          tar -xzf guangyue-panel-${{ matrix.asset || matrix.edition }}-*-linux-amd64.tar.gz
          cd guangyue-panel-${{ matrix.asset || matrix.edition }}-*-linux-amd64
          GY_BIN_DIR="$PWD/bin" bash scripts/fetch-xray.sh
          GY_BIN_DIR="$PWD/bin" bash scripts/fetch-mihomo.sh
      - name: Real systemd installation, certificate rotation, edition migration and rollback
        env:
          GY_INTEGRATION_EDITION: ${{ matrix.edition }}
        run: |
          # Privileged upgrade code must come from a root-owned directory.
          # Keep the same trust boundary used by production CLI upgrades.
          bundle=$(realpath build/releases/guangyue-panel-${{ matrix.asset || matrix.edition }}-*-linux-amd64)
          # Hosted images allow runner writes to /opt; privileged helpers need
          # the protected parent permissions used by standard deployments.
          sudo chmod go-w /opt
          sudo install -d -m 0700 /root/guangyue-ci-bundle
          sudo cp -R "$bundle" /root/guangyue-ci-bundle/release
          sudo chown -R root:root /root/guangyue-ci-bundle/release
          sudo --preserve-env=GITHUB_ACTIONS,GY_INTEGRATION_EDITION python3 deploy/tests/integration.py /root/guangyue-ci-bundle/release
  docker-build:
    name: docker image archive (linux/amd64)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the exact checked native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name linux-amd64 --dir build/releases
      - name: Build immutable application and database image archive
        run: bash scripts/build-docker.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-linux-amd64
          path: |
            build/docker-releases/*.tar.gz
            build/docker-releases/DOCKER_IMAGES.json
            build/docker-releases/SHA256SUMS
          retention-days: 7
  docker-installation:
    name: docker installation (${{ matrix.edition }})
    needs: [check, docker-build]
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, pro]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - name: Record the exact Go executable for isolated CI versions
        run: printf 'GY_GO=%s\n' "$(command -v go)" >> "$GITHUB_ENV"
      - name: Download native and Docker artifacts for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name linux-amd64 --dir build/releases
          gh run download "$GITHUB_RUN_ID" --name docker-linux-amd64 --dir build/docker-releases
      - name: Prepare disposable host with its existing Nginx on port 80
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx python3 curl openssl iproute2
          sudo systemctl enable --now nginx
          sudo chmod go-w /opt
          sudo install -d -m 0700 /root/guangyue-docker-ci
          sudo cp -R build/releases build/docker-releases /root/guangyue-docker-ci/
          sudo chown -R root:root /root/guangyue-docker-ci
      - name: Real Docker install, TLS, Reality/HY2, isolated restarts and recovery
        env:
          GY_DOCKER_INTEGRATION_EDITION: ${{ matrix.edition }}
        run: sudo --preserve-env=GITHUB_ACTIONS,GY_DOCKER_INTEGRATION_EDITION,GY_GO python3 deploy/tests/docker_integration.py /root/guangyue-docker-ci/releases /root/guangyue-docker-ci/docker-releases
  native-oneclick:
    name: native one-click (${{ matrix.os }}, ${{ matrix.edition }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            edition: lite
          - os: ubuntu-24.04
            edition: pro
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - name: Download this commit's exact native installation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name linux-amd64 --dir build/releases
      - name: Prepare disposable server and protected release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx python3 curl openssl
          sudo systemctl enable --now nginx
          sudo chmod go-w /opt
          cd build/releases
          sha256sum -c SHA256SUMS
          tar -xzf guangyue-panel-${{ matrix.edition }}-*-linux-amd64.tar.gz
          bundle=$(realpath guangyue-panel-${{ matrix.edition }}-*-linux-amd64)
          sudo install -d -m 0700 /root/guangyue-oneclick-ci
          sudo cp -R "$bundle" /root/guangyue-oneclick-ci/release
          sudo chown -R root:root /root/guangyue-oneclick-ci/release
          printf 'GY_GO=%s\n' "$(command -v go)" >> "$GITHUB_ENV"
      - name: Real private gateway, untouched Nginx, certificate renewal and updater recovery
        env:
          GY_NATIVE_EDITION: ${{ matrix.edition }}
          GY_ONECLICK_INTEGRATION: '1'
        run: sudo --preserve-env=GITHUB_ACTIONS,GY_NATIVE_EDITION,GY_ONECLICK_INTEGRATION,GY_GO python3 deploy/tests/native_oneclick_integration.py /root/guangyue-oneclick-ci/release
