  <g fill="#8fc8a9" opacity=".35">
    <circle cx="405" cy="504" r="5"/><circle cx="432" cy="482" r="3"/><circle cx="456" cy="509" r="4"/>
    <circle cx="802" cy="499" r="4"/><circle cx="830" cy="476" r="3"/>
