  <path d="M0 486 Q175 394 349 486 L349 521 Q175 438 0 521Z" fill="#081b20" opacity=".9"/>
  <path d="M852 455 Q1020 358 1200 455 L1200 500 Q1020 413 852 500Z" fill="#081b20" opacity=".95"/>
